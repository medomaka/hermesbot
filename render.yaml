# Render Deployment Configuration
# Web Service for the Terminal-Style Telegram Bot

services:
  - type: web
    name: karisfare-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_main.py
    envVars:
      - key: TELEGRAM_TOKEN
        value: 9097468849:AAEqg3_toi3jijmbDOiCfOtBDHPv6KWAVSY
      - key: WEBHOOK_PORT
        value: "8080"
    autoDeploy: true
    healthCheckPath: /health
    region: oregon
    plan: free
